# Drawing-set theme: diazo whiteprint paper, violet-blue line ink, graphite, red pencil.
[theme]
base = "light"
primaryColor = "#3a3d8c"
backgroundColor = "#eceee9"
secondaryBackgroundColor = "#e1e3dc"
textColor = "#24262b"
linkColor = "#3a3d8c"
borderColor = "#b9bccb"
baseRadius = "0.125rem"
font = "Overpass:https://fonts.googleapis.com/css2?family=Overpass:wght@300..900&display=swap, sans-serif"
headingFont = "Overpass:https://fonts.googleapis.com/css2?family=Overpass:wght@300..900&display=swap, sans-serif"
codeFont = "Overpass Mono:https://fonts.googleapis.com/css2?family=Overpass+Mono:wght@300..700&display=swap, monospace"
showWidgetBorder = true

[theme.sidebar]
backgroundColor = "#e4e6df"
secondaryBackgroundColor = "#d9dbd3"
borderColor = "#3a3d8c"

[client]
toolbarMode = "minimal"

[browser]
gatherUsageStats = false
