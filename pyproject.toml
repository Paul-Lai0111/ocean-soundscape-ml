[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "oceansound"
version = "0.1.0"
description = "Passive-acoustic soundscape features and clustering for ocean hydrophone data (MBARI Pacific Sound)"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "pandas>=2.0",
    "scikit-learn>=1.3",
    "matplotlib>=3.7",
    "soundfile>=0.12",
    "s3fs>=2023.6",
    "streamlit>=1.50",
    "plotly>=5.18",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
